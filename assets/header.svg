    <style>
      text { font-family: 'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace; }
      .rain { fill:#3dff8a; font-size:14px; animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
      @keyframes fall { from { transform: translateY(0); } to { transform: translateY(700px); } }
      .type1 { animation: type1 2.6s steps(53) 0.6s both; }
      .type2 { animation: type2 1.9s steps(34) 3.5s both; }
      @keyframes type1 { from { width:0; } to { width:578px; } }
      @keyframes type2 { from { width:0; } to { width:373px; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0; } }
      .glA { animation: glA 4s infinite; } .glB { animation: glB 4s infinite; }
      @keyframes glA { 0%,88%,100% { transform:translate(0,0); opacity:0; } 89% { transform:translate(-4px,1px); opacity:.8; } 91% { transform:translate(3px,-1px); opacity:.8; } 93% { opacity:0; } }
      @keyframes glB { 0%,88%,100% { transform:translate(0,0); opacity:0; } 89% { transform:translate(4px,-1px); opacity:.8; } 91% { transform:translate(-3px,1px); opacity:.8; } 93% { opacity:0; } }
      .pulse { animation: pulse 2s ease-in-out infinite; } @keyframes pulse { 50% { opacity:.35; } }
    </style>
